name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (luac + luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - name: Syntax check every Lua file
        run: |
          status=0
          while IFS= read -r file; do
            luac5.1 -p "$file" || status=1
          done < <(find Flipper tests -name '*.lua')
          exit $status
      - name: luacheck
        run: luacheck Flipper tests

  test:
    name: Tests (Lua 5.1 logic tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Logic tests and load check
        run: python tests/run_tests.py --syntax

  toc:
    name: TOC and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: TOC lists every file, every file is listed
        run: python tools/check_toc.py
      - name: Tools compile
        run: python -m compileall -q tools tests

  package:
    name: Package
    needs: [lint, test, toc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build zip
        run: python tools/package.py --version "dev-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: Flipper-dev-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
